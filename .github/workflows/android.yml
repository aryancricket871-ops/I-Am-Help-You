name: Build Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      # Repo -> Settings -> Variables -> Actions: API_BASE = your live site, e.g. https://i-am-help-you.xxx.workers.dev
      - run: npm run build:app
        env:
          VITE_APP: "1"
          VITE_API_BASE: ${{ vars.API_BASE }}
          VITE_PUBLIC_URL: ${{ vars.API_BASE }}
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: i-am-help-you-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
